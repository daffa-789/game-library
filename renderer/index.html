<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' glib: https: http: data:; font-src 'self'; connect-src 'self'">
  <title>Game Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header id="topbar">
    <div class="brand">
      <img src="../assets/logo.svg" alt="logo" draggable="false">
      <div class="brand-text">GAME<span>LIBRARY</span></div>
    </div>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
      <input id="search" type="text" placeholder="Cari judul game...  (Ctrl+F)" autocomplete="off" spellcheck="false">
    </div>
    <div class="topbar-actions">
      <button id="btn-steam" class="btn steam">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"></path>
          <path d="M12 8v8"></path><path d="M8 12h8"></path>
        </svg>
        Steam Link
      </button>
      <button id="btn-add" class="btn green">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Tambah Game
      </button>
    </div>
  </header>

  <!-- ===== VIEW: LIBRARY ===== -->
  <main id="view-library">
    <div class="toolbar">
      <h1 id="lib-title">Semua Game <span id="lib-count"></span></h1>
      <label class="sort-wrap">
        <span>Urutkan</span>
        <select id="sort">
          <option value="new">Terbaru</option>
          <option value="az">Judul A&ndash;Z</option>
          <option value="za">Judul Z&ndash;A</option>
        </select>
      </label>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">
      <svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="#3d5a75" stroke-width="2.5" stroke-linecap="round">
        <rect x="6" y="18" width="52" height="30" rx="10"></rect>
        <line x1="18" y1="28" x2="18" y2="38"></line><line x1="13" y1="33" x2="23" y2="33"></line>
        <circle cx="42" cy="30" r="2.6" fill="#3d5a75" stroke="none"></circle>
        <circle cx="49" cy="36" r="2.6" fill="#3d5a75" stroke="none"></circle>
      </svg>
      <h3 id="empty-title">Library masih kosong</h3>
      <p id="empty-sub">Tambahkan game pertama Anda beserta link download dan spesifikasinya.</p>
      <button id="btn-empty-add" class="btn green">+ Tambah Game Pertama</button>
    </div>
  </main>

  <!-- ===== VIEW: DETAIL ===== -->
  <section id="view-detail" class="hidden"></section>

  <!-- ===== MODALS ===== -->
  <div id="modal-backdrop" class="hidden"></div>

  <!-- Form tambah/edit -->
  <div class="modal hidden" id="modal-form">
    <div class="modal-head">
      <h2 id="form-title">Tambah Game</h2>
      <button class="icon-btn" id="form-close" title="Tutup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="frow two">
        <div class="field">
          <label for="f-title">Judul Game *</label>
          <input id="f-title" type="text" placeholder="mis. Grand Theft Auto V" spellcheck="false">
        </div>
        <div class="field">
          <label for="f-link">Link Download (Google Drive) *</label>
          <input id="f-link" type="text" placeholder="https://drive.google.com/file/d/..." spellcheck="false">
        </div>
      </div>

      <div class="field thumb-field">
        <label>Thumbnail</label>
        <div class="thumb-row">
          <img id="f-thumb-preview" alt="preview thumbnail">
          <div class="thumb-actions">
            <button id="f-pick" class="btn ghost">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <path d="M21 15l-5-5L5 21"></path>
              </svg>
              Pilih Gambar dari Komputer&hellip;
            </button>
            <div class="or-line"><span>atau tempel URL gambar</span></div>
            <input id="f-thumburl" type="text" placeholder="https://contoh.com/gambar.jpg" spellcheck="false">
            <button id="f-thumb-clear" class="btn ghost small">Hapus Gambar</button>
          </div>
        </div>
      </div>

      <div class="frow three">
        <div class="field">
          <label for="f-genre">Genre</label>
          <input id="f-genre" type="text" placeholder="mis. Action, RPG" spellcheck="false">
        </div>
        <div class="field">
          <label for="f-size">Ukuran Game</label>
          <input id="f-size" type="text" placeholder="mis. 90 GB" spellcheck="false">
        </div>
        <div class="field">
          <label for="f-price">Harga</label>
          <input id="f-price" type="text" placeholder="mis. Rp 25.000" spellcheck="false">
        </div>
      </div>

      <div class="spec-editor">
        <div class="spec-col">
          <h3>MINIMUM</h3>
          <div id="f-spec-min"></div>
        </div>
        <div class="spec-col">
          <h3>RECOMMENDED</h3>
          <div id="f-spec-rec"></div>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="form-cancel">Batal</button>
      <button class="btn green" id="form-save">Simpan Game</button>
    </div>
  </div>

  <!-- Konfirmasi hapus -->
  <div class="modal small hidden" id="modal-confirm">
    <div class="modal-head"><h2>Hapus Game?</h2></div>
    <div class="modal-body"><p class="hint" id="confirm-msg"></p></div>
    <div class="modal-foot">
      <button class="btn ghost" id="confirm-cancel">Batal</button>
      <button class="btn danger" id="confirm-ok">Ya, Hapus</button>
    </div>
  </div>

  <!-- Impor dari Steam -->
  <div class="modal small hidden" id="modal-steam">
    <div class="modal-head">
      <h2>Impor dari Steam</h2>
      <button class="icon-btn" id="steam-close" title="Tutup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="steam-url">Link halaman Steam Store</label>
        <input id="steam-url" type="text" placeholder="https://store.steampowered.com/app/271590/" spellcheck="false" autocomplete="off">
      </div>
      <p id="steam-status" class="error-text hidden"></p>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="steam-cancel">Batal</button>
      <button class="btn green" id="steam-fetch">Ambil Data Steam</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
