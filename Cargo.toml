[package]
name = "softgame-library"
version = "3.0.0"
edition = "2021"
description = "Katalog digital dua tab (game & software) — versi Rust native dengan egui/eframe, pengganti penuh stack Electron + React."
license = "MIT"
authors = ["Daffa"]

[[bin]]
name = "softgame-library"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
uuid = { version = "1", features = ["v4"] }
regex = "1"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
rfd = "0.15"
arboard = "3"
open = "5"

[profile.release]
opt-level = 2
