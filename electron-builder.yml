# Konfigurasi paket Windows (installer NSIS) untuk SoftGame Library.
#
# files sengaja dibatasi: hanya proses utama Electron, hasil build renderer,
# ikon jendela, dan package.json. Sumber Go/Wails lama dan cover bawaan
# (seedcovers/) sudah tidak ikut karena katalog kini dimulai kosong.
appId: com.daffa.softgamelibrary
productName: SoftGame Library
copyright: Copyright © 2026 Daffa

directories:
  output: build/bin
  buildResources: build

files:
  - electron/**/*
  - dist/**/*
  - build/windows/icon.ico
  - package.json
  - '!**/*.map'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/windows/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SoftGame Library
  artifactName: SoftGameLibrary-Setup-${version}-amd64.${ext}
